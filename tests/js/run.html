<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Walter JS-tester</title>
</head>
<body>
<pre id="result">Kör…</pre>
<script>
// Minimal testlöpare. Testfiler anropar test(namn, fn) och eq(a, b); fn får vara async.
const _tests = [];
function test(name, fn) { _tests.push({ name, fn }); }
function eq(a, b) {
  if (JSON.stringify(a) !== JSON.stringify(b)) {
    throw new Error("väntade " + JSON.stringify(b) + ", fick " + JSON.stringify(a));
  }
}
async function rejects(promise, msg) {
  try { await promise; } catch (e) {
    if (msg !== undefined && e.message !== msg) throw new Error("fel meddelande: " + e.message);
    return;
  }
  throw new Error("avvisades inte");
}
window.addEventListener("load", async () => {
  const fails = [];
  for (const t of _tests) {
    try { await t.fn(); } catch (e) { fails.push("FAIL " + t.name + ": " + e.message); }
  }
  if (!_tests.length) fails.push("FAIL inga tester registrerades");
  document.getElementById("result").textContent =
    fails.length ? fails.join("\n") : "PASS " + _tests.length;
});
window.addEventListener("error", (e) => {
  _tests.push({ name: "laddning " + (e.filename || "").split("/").pop(), fn() { throw new Error(e.message); } });
});
// En fil som inte går att ladda (t.ex. 404) blir ett FAIL i stället för att tyst försvinna.
function _missing(el) {
  _tests.push({ name: "laddning " + el.getAttribute("src"), fn() { throw new Error("filen kunde inte laddas"); } });
}
</script>
<!-- Skript under test (onerror="_missing(this)" på varje rad) -->
<script src="../../js/vault.js" onerror="_missing(this)"></script>
<script src="../../js/engine.js" onerror="_missing(this)"></script>
<script src="../../js/exchanges.js" onerror="_missing(this)"></script>
<script src="../../js/user-state.js" onerror="_missing(this)"></script>
<script src="../../js/intro.js" onerror="_missing(this)"></script>
<script src="../../js/app.js" onerror="_missing(this)"></script>
<!-- Testfiler: lägg till en rad per fil -->
<script src="vault.test.js" onerror="_missing(this)"></script>
<script src="engine.test.js" onerror="_missing(this)"></script>
<script src="exchanges.test.js" onerror="_missing(this)"></script>
<script src="user-state.test.js" onerror="_missing(this)"></script>
<script src="intro.test.js" onerror="_missing(this)"></script>
<script src="app.test.js" onerror="_missing(this)"></script>
</body>
</html>
